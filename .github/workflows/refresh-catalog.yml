# Met à jour chaque heure les videoId du catalogue servi à l'appli (voir tools/refresh_catalog.py).
name: Refresh catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh video IDs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # Recherche de nouveaux directs une fois par jour (6 h UTC) ou au lancement manuel.
          extra=""
          if [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            extra="--discover tools/candidates.md"
          fi
          python3 tools/refresh_catalog.py catalog.json $extra

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json tools/candidates.md
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "catalog: automatic refresh (video IDs, candidates)"
            git push
          fi
